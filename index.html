<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Silk in France</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

body{
  margin:0;
  background:black;
  font-family:Helvetica,Arial,sans-serif;
}

#map{
  height:600px;
  width:90vw;
  min-width:500px;
  max-width:1200px;
  margin:60px auto;
  background:black;
}

.leaflet-popup-content-wrapper{
  background:white;
  color:black;
  border-radius:0;
  border:1px solid black;
  box-shadow:none;
}

.leaflet-popup-tip{
  display:none;
}

.popup-content img{
  width:100%;
  margin-bottom:6px;
}

</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map',{
  zoomControl:false,
  attributionControl:false,
  minZoom:5.5,
  maxZoom:9
});

var museums=[];

function addMuseum(lat,lng,name,img,link,description){
  museums.push({lat,lng,name,img,link,description});
}

fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/FRA.geo.json")
.then(res=>res.json())
.then(data=>{

  var france=L.geoJSON(data,{
    style:{
      color:"#D4AF37",
      weight:2,
      fillOpacity:0
    }
  }).addTo(map);

  var bounds=france.getBounds();

  map.fitBounds(bounds,{
    padding:[40,40],
    animate:true,
    duration:1.2
  });

  map.setMaxBounds(bounds.pad(0.2));

  /* add image covering france bounds */

  var image=L.imageOverlay(
    "https://images.rawpixel.com/image_social_square/cHJpdmF0ZS9zdGF0aWMvZmlsZXMvd2Vic2l0ZS8yMDIyLTA5L3NtaXRoc25jaHNkbTZhYTRjYzMxZjU2MjIwMDAwMDEtaW1hZ2UuanBn.jpg",
    bounds
  ).addTo(map);

  image.bringToBack();

  /* add museums */

  museums.forEach(m=>{

    var marker=L.circleMarker([m.lat,m.lng],{
      radius:7,
      fillColor:"black",
      color:"white",
      weight:1.5,
      fillOpacity:1
    }).addTo(map);

    var popup=`
      <div class="popup-content">
      <strong>${m.name}</strong><br><br>
      <img src="${m.img}">
      ${m.description}<br><br>
      <a href="${m.link}" target="_blank">Visit website</a>
      </div>
    `;

    marker.bindPopup(popup,{
      closeButton:false,
      autoClose:false
    });

    marker.on("mouseover",function(){this.openPopup();});
    marker.on("mouseout",function(){this.closePopup();});

  });

});


addMuseum(
  48.8606,
  2.3376,
  "Louvre Museum",
  "https://upload.wikimedia.org/wikipedia/commons/a/a6/Paris_July_2011-27a.jpg",
  "https://www.louvre.fr",
  "Historic museum in Paris."
);

</script>

</body>
</html>
